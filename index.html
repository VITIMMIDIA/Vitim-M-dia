
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vitim Mídia</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }
    header {
      background: #0755a5;
      color: white;
      padding: 25px;
      text-align: center;
    }
    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
    }
    .painel {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 10px #0001;
    }
    button {
      background: #0755a5;
      color: white;
      border: 0;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>Vitim Mídia</h1>
    <p>Sistema de gerenciamento de mídia indoor</p>
  </header>

  <main>
    <div class="painel">
      <h2>Painel administrativo</h2>
      <p>Bem-vindo ao Vitim Mídia!</p>
      <p>Status do sistema: <strong>Em desenvolvimento</strong></p>
      <button onclick="alert('Vitim Mídia iniciado!')">
        Acessar painel
      </button>
    </div>
  </main>
</body>
</html>
